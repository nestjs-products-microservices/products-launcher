apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orders-ms
  name: orders-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-ms
  strategy: {}
  template:
    metadata:
      labels:
        app: orders-ms
    spec:
      containers:
      - image: southamerica-east1-docker.pkg.dev/ecommerce-microservices-488103/image-registry/orders-ms
        name: orders-ms
        env:
          - name: PORT
            value: "3000"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: orders-secret
                key: database_url
          - name: NATS_SERVERS
            value: "nats://nats"
        resources: {}
status: {}
