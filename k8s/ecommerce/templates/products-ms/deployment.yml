apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: products-ms
  name: products-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-ms
  strategy: {}
  template:
    metadata:
      labels:
        app: products-ms
    spec:
      containers:
      - image: southamerica-east1-docker.pkg.dev/ecommerce-microservices-488103/image-registry/products-ms
        name: products-ms
        env:
          - name: PORT
            value: "3000"
          - name: DATABASE_URL
            value: "file:./dev.db"
          - name: NATS_SERVERS
            value: "nats://nats"
        resources: {}
status: {}
